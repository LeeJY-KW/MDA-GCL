dataset: seed_iv
protocol: cross_session
de_path: data/seed_iv/SEED_IV_4S_DE.npy
psd_path: data/seed_iv/SEED_IV_4S_PSD.npy
eye_path: data/seed_iv/SEED_IV_4S_EYE.npy
label_path: data/seed_iv/SEED_IV_4S_LABEL.npy
n_subjects: 15
n_classes: 4
