[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mda-gcl"
version = "3.0.0"
description = "MDA-GCL experiment package"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "scikit-learn",
    "PyYAML",
]

[project.scripts]
mda-gcl = "mda_gcl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
